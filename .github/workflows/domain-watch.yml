name: Domain Watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to check"
        required: false
        default: "cleofields.com"

permissions:
  contents: read
  issues: write

concurrency:
  group: domain-watch-${{ github.event.inputs.domain || 'cleofields.com' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOMAIN: ${{ github.event.inputs.domain || 'cleofields.com' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test registry status checker
        run: python3 -B -m unittest discover -s scripts -p 'test_domain_status.py' -v

      - name: Check domain status and update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ts="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          issue_title="Domain Watch: ${DOMAIN}"
          repo="${GITHUB_REPOSITORY}"

          # Failed/ambiguous lookups exit before changing the last verified state.
          result="$(python3 scripts/domain_status.py "$DOMAIN")"
          state="$(jq -r '.state' <<< "$result")"
          raw_status="$(jq -r '.statuses | join(", ")' <<< "$result")"
          source_url="$(jq -r '.source' <<< "$result")"

          issue_number="$(gh issue list -R "$repo" --state open --search "${issue_title} in:title" --json number,title --jq '.[] | select(.title == "'"$issue_title"'") | .number' | head -n1 || true)"

          if [[ -z "$issue_number" ]]; then
            body=$(cat <<EOF
          Domain watcher is active for **${DOMAIN}**.

          - Current state: \
            **${state}**
          - Registry statuses: \
            ${raw_status:-none}
          - Last checked (UTC): \
            ${ts}
          - Source: ${source_url}

          Availability means the registry returned no domain record; confirm registration with a registrar before purchasing. Earlier WHOIS-based availability alerts may have been false positives.

          <!-- last_state:${state} -->
          <!-- last_raw_status:${raw_status} -->
          <!-- last_checked:${ts} -->
          EOF
          )

            gh issue create -R "$repo" --title "$issue_title" --body "$body" >/dev/null
            echo "Created tracking issue for ${DOMAIN}"
            exit 0
          fi

          current_body="$(gh issue view -R "$repo" "$issue_number" --json body --jq '.body')"
          previous_state="$(printf '%s' "$current_body" | sed -nE 's/.*<!-- last_state:([^ ]+) -->.*/\1/p' | head -n1 || true)"
          previous_raw="$(printf '%s' "$current_body" | sed -nE 's/.*<!-- last_raw_status:(.*) -->.*/\1/p' | head -n1 || true)"

          new_body=$(cat <<EOF
          Domain watcher is active for **${DOMAIN}**.

          - Current state: \
            **${state}**
          - Registry statuses: \
            ${raw_status:-none}
          - Last checked (UTC): \
            ${ts}
          - Source: ${source_url}

          Availability means the registry returned no domain record; confirm registration with a registrar before purchasing. Earlier WHOIS-based availability alerts may have been false positives.

          <!-- last_state:${state} -->
          <!-- last_raw_status:${raw_status} -->
          <!-- last_checked:${ts} -->
          EOF
          )

          gh issue edit -R "$repo" "$issue_number" --body "$new_body" >/dev/null

          if [[ "$state" != "$previous_state" ]] || [[ "$raw_status" != "$previous_raw" ]]; then
            change_msg=$(cat <<EOF
          Status change detected for **${DOMAIN}** at ${ts}.

          - Previous state: ${previous_state:-unknown}
          - New state: ${state}
          - Previous raw status: ${previous_raw:-none}
          - New raw status: ${raw_status:-none}
          EOF
          )

            gh issue comment -R "$repo" "$issue_number" --body "$change_msg" >/dev/null
            echo "Status changed: ${previous_state:-unknown} -> ${state}"
          else
            echo "No status change: ${state}"
          fi

          if [[ "$state" != "$previous_state" ]] && [[ "$state" == "pendingDelete" || "$state" == "available" ]]; then
            alert_msg=$(cat <<EOF
          Alert for **${DOMAIN}**:

          - State is now **${state}**
          - Checked at ${ts}
          - Registry source: ${source_url}

          A pendingDelete domain is not yet available. An available result means no record was found at the registry; confirm registration with a registrar before purchasing.
          EOF
          )
            gh issue comment -R "$repo" "$issue_number" --body "$alert_msg" >/dev/null
            echo "Alert comment posted for ${state}"
          fi
